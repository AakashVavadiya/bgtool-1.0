# ==============================================================================
# NGINX SNIPPET: Public Developer REST API (/api/v1/*)
# Place this in /etc/nginx/snippets/api-v1.conf or inside your server block
# ==============================================================================

# Note: Add this rate limit zone in the http {} block of nginx.conf if not already present:
# limit_req_zone $binary_remote_addr zone=bg_public_api:10m rate=60r/m;
# limit_req_status 429;

location /api/v1/ {
    # 60 req/min per IP with burst of 20
    limit_req zone=bg_public_api burst=20 nodelay;

    # Allow up to 60MB uploads (30MB raw file + base64/multipart overhead)
    client_max_body_size 60M;
    client_body_buffer_size 256k;

    # Forward to Node application (PM2 on 127.0.0.1:3000)
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;

    # IP Forwarding with anti-spoofing
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Disable proxy and browser caching for dynamic API responses
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # Extended timeout for AI neural background removal and face detection
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}
