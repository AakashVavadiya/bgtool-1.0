# ==============================================================================
# PRODUCTION NGINX REVERSE PROXY & SECURITY CONFIGURATION
# Domain: https://bg.tools (brand: bg.tools)
# Admin Panel: admin.bg.tools
# For BG Tool (Node TanStack Start + Python AI Engines)
# ==============================================================================

# Rate Limiting Zones (Keyed by client binary IP)
limit_req_zone $binary_remote_addr zone=bg_general:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=bg_expensive:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=bg_public_api:10m rate=60r/m;
limit_req_status 429;

# HTTP -> HTTPS Redirect (All subdomains)
server {
    listen 80;
    listen [::]:80;
    server_name bg.tools www.bg.tools admin.bg.tools;

    # Enforce HTTPS redirect
    return 301 https://$host$request_uri;
}

# Main Application: https://bg.tools
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bg.tools www.bg.tools;

    # SSL Certificate Paths (Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/bg.tools/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bg.tools/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Maximum Upload Size (60M accommodates 30 MB raw file + multipart/Base64 overhead)
    client_max_body_size 60M;
    client_body_buffer_size 256k;

    # Custom Branded Security Error Pages
    error_page 429 /429.html;
    error_page 403 /403.html;

    location = /429.html {
        root /var/www/bgtool/public;
        internal;
    }

    location = /403.html {
        root /var/www/bgtool/public;
        internal;
    }

    # Production HTTP Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Canonical SEO Redirects for route template placeholders & legacy tool slugs
    location = /tools/$slug {
        return 301 https://bg.tools/tools;
    }
    location = /news/$slug {
        return 301 https://bg.tools/news;
    }
    location = /tools/clean-upscale {
        return 301 https://bg.tools/tools/upscale-image;
    }
    location = /tools/rotate-crop {
        return 301 https://bg.tools/tools/rotate-image;
    }
    location = /tools/convert-compress {
        return 301 https://bg.tools/tools/compress-image;
    }

    # Static Assets (bypass request rate limiter so assets never trigger 429)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Root proxy to Node TanStack Server (PM2 on 127.0.0.1:3000)
    location / {
        limit_req zone=bg_general burst=60 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        # Anti-spoofing: Overwrite headers with trusted upstream IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Public Developer REST API (/api/v1/*)
    # Dedicated rate limit zone, no caching, 60M body, 120s timeout
    location /api/v1/ {
        limit_req zone=bg_public_api burst=20 nodelay;

        client_max_body_size 60M;
        client_body_buffer_size 256k;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable all caching for API responses
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # Timeout for heavy image processing
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Stricter Rate Limiting on Expensive AI/Inference Routes
    location ~* ^/api/(remove-bg|remove-watermark|blur-face|detect-faces|chat) {
        limit_req zone=bg_expensive burst=3 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Anti-spoofing: Overwrite headers with trusted upstream IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeout for heavy neural inference
        proxy_read_timeout 90s;
    }
}

# Dedicated Admin Panel Subdomain: admin.bg.tools
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.bg.tools;

    # SSL Certificate Paths
    # ssl_certificate /etc/letsencrypt/live/admin.bg.tools/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/admin.bg.tools/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # IP Whitelist for Admin (Uncomment and configure your office/VPN IPs)
    # allow 203.0.113.195;  # Primary admin office IP
    # allow 198.51.100.42;  # Secure VPN gateway IP
    # deny all;             # Block all other IPs

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
